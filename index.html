<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snow Queen</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Times New Roman', serif;
    background: #000;
    color: #d8e4f0;
  }

  /* ============================================
     ЭКРАН СТАРТА (клик для запуска)
     ============================================ */
  #startScreen {
    position: fixed; inset: 0;
    background: #000;
    z-index: 10000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: opacity 1s ease;
    padding: 30px;
  }
  #startScreen.hidden { opacity: 0; pointer-events: none; }

  .start-aquila {
    font-size: 60px;
    color: #4a7aa5;
    text-shadow:
      0 0 30px rgba(120, 180, 240, 0.8),
      0 0 60px rgba(80, 140, 200, 0.5);
    margin-bottom: 40px;
    letter-spacing: 20px;
    animation: pulseGlow 3s infinite;
  }
  @keyframes pulseGlow {
    0%, 100% {
      text-shadow: 0 0 30px rgba(120,180,240,0.8), 0 0 60px rgba(80,140,200,0.5);
    }
    50% {
      text-shadow: 0 0 50px rgba(180,220,255,1), 0 0 100px rgba(120,180,240,0.7), 0 0 140px rgba(80,140,200,0.5);
    }
  }

  .start-title {
    font-size: 48px;
    letter-spacing: 16px;
    color: #e8f0f8;
    text-shadow: 0 0 20px rgba(180, 220, 255, 0.6), 0 0 40px rgba(120, 180, 240, 0.4);
    text-transform: uppercase;
    margin-bottom: 15px;
    text-align: center;
  }

  .start-sub {
    font-family: 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 6px;
    color: #a8c0d8;
    text-transform: uppercase;
    margin-bottom: 60px;
    text-align: center;
  }

  .start-hint {
    font-family: 'Courier New', monospace;
    font-size: 13px;
    letter-spacing: 5px;
    color: #607a95;
    text-transform: uppercase;
    padding: 18px 40px;
    border: 1px solid rgba(120, 180, 240, 0.4);
    background: rgba(10, 20, 30, 0.5);
    animation: hintBlink 2s ease-in-out infinite;
    backdrop-filter: blur(6px);
  }
  @keyframes hintBlink {
    0%, 100% { opacity: 0.6; box-shadow: 0 0 15px rgba(120, 180, 240, 0.3); }
    50% { opacity: 1; box-shadow: 0 0 30px rgba(120, 180, 240, 0.6); }
  }

  .start-author {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    letter-spacing: 4px;
    color: #405a70;
    text-transform: uppercase;
    margin-top: 40px;
  }

  /* ============================================
     ИНТРО
     ============================================ */
  #intro {
    position: fixed; inset: 0;
    background: #000;
    z-index: 9999;
    overflow: hidden;
    transition: opacity 1.2s ease;
  }
  #intro.hidden { opacity: 0; pointer-events: none; }

  #bgLayer {
    position: absolute; inset: -5%;
    background: #0a1218 url('bg.jpg') center/cover no-repeat;
    opacity: 0;
    transition: opacity 3s ease;
    filter: brightness(0.7) contrast(1.05) saturate(0.9);
    animation: bgDrift 40s ease-in-out infinite alternate;
  }
  #bgLayer.show { opacity: 1; }
  @keyframes bgDrift {
    0% { transform: scale(1.05) translate(0, 0); }
    100% { transform: scale(1.12) translate(-2%, -1%); }
  }
  #bgLayer::after {
    content: '';
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.85) 100%),
      linear-gradient(180deg, rgba(0,10,20,0.5) 0%, transparent 40%, transparent 60%, rgba(0,5,10,0.7) 100%);
    pointer-events: none;
  }

  #snowCanvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 2;
  }

  #introTitles {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 3;
    opacity: 0;
    transition: opacity 1.5s ease;
    pointer-events: none;
    text-align: center;
    padding: 20px;
  }
  #introTitles.show { opacity: 1; }

  .title-main {
    font-size: 64px;
    letter-spacing: 20px;
    color: #e8f0f8;
    text-shadow:
      0 0 20px rgba(180, 220, 255, 0.6),
      0 0 40px rgba(120, 180, 240, 0.4),
      0 0 60px rgba(60, 120, 200, 0.3);
    text-transform: uppercase;
    font-weight: normal;
    animation: titlePulse 4s ease-in-out infinite;
  }
  @keyframes titlePulse {
    0%, 100% { text-shadow: 0 0 20px rgba(180,220,255,0.6), 0 0 40px rgba(120,180,240,0.4); }
    50% { text-shadow: 0 0 30px rgba(220,240,255,0.9), 0 0 60px rgba(120,180,240,0.6), 0 0 90px rgba(60,120,200,0.4); }
  }

  .title-sub {
    font-family: 'Courier New', monospace;
    font-size: 14px;
    letter-spacing: 8px;
    color: #a8c0d8;
    margin-top: 20px;
    text-shadow: 0 0 10px rgba(120, 180, 240, 0.4);
    text-transform: uppercase;
  }

  .title-author {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 5px;
    color: #607a95;
    margin-top: 40px;
    text-transform: uppercase;
  }
  .title-author span {
    color: #c0d8f0;
    text-shadow: 0 0 12px rgba(120, 180, 240, 0.6);
  }

  #skipBtn {
    position: absolute;
    top: 25px;
    right: 30px;
    z-index: 10;
    padding: 10px 20px;
    background: rgba(10, 20, 30, 0.6);
    border: 1px solid rgba(180, 220, 255, 0.4);
    color: #d8e4f0;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 4px;
    cursor: pointer;
    transition: all 0.3s;
    text-transform: uppercase;
    backdrop-filter: blur(4px);
    opacity: 0;
  }
  #skipBtn.show { opacity: 1; }
  #skipBtn:hover {
    background: rgba(180, 220, 255, 0.15);
    border-color: #d8e4f0;
    color: #fff;
    box-shadow: 0 0 20px rgba(180, 220, 255, 0.4);
  }

  /* Прогресс-бар трека внизу */
  #progressBar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    background: rgba(0, 0, 0, 0.5);
    z-index: 8;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  #progressBar.show { opacity: 1; }
  #progressFill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #4a7aa5, #a8c0d8, #e8f0f8);
    box-shadow: 0 0 10px rgba(180, 220, 255, 0.8);
    transition: width 0.3s linear;
  }

  /* ============================================
     ОСНОВНАЯ СТРАНИЦА
     ============================================ */
  #mainSite {
    position: fixed; inset: 0;
    background: #0a1218 url('bg.jpg') center/cover no-repeat;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 1;
    opacity: 0;
    transition: opacity 1.5s ease;
    overflow: hidden;
  }
  #mainSite.show { opacity: 1; }
  #mainSite::before {
    content: '';
    position: absolute; inset: 0;
    background: rgba(0, 10, 20, 0.75);
    backdrop-filter: blur(4px);
    z-index: 0;
  }
  .main-content {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 40px;
    max-width: 800px;
  }
  .main-title {
    font-size: 56px;
    letter-spacing: 16px;
    color: #e8f0f8;
    text-shadow: 0 0 30px rgba(180, 220, 255, 0.5), 0 0 60px rgba(120, 180, 240, 0.3);
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  .main-sub {
    font-family: 'Courier New', monospace;
    font-size: 13px;
    letter-spacing: 6px;
    color: #a8c0d8;
    text-transform: uppercase;
    margin-bottom: 40px;
  }
  .main-info {
    font-family: 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 3px;
    color: #607a95;
    line-height: 2;
    text-transform: uppercase;
    padding: 20px;
    border: 1px solid rgba(120, 180, 240, 0.3);
    background: rgba(10, 20, 30, 0.5);
    max-width: 500px;
    margin: 0 auto;
    backdrop-filter: blur(6px);
  }
  .main-info .highlight {
    color: #c0d8f0;
    text-shadow: 0 0 12px rgba(120, 180, 240, 0.6);
  }
  .main-footer {
    position: fixed;
    bottom: 20px;
    left: 0; right: 0;
    text-align: center;
    font-family: 'Courier New', monospace;
    font-size: 10px;
    letter-spacing: 4px;
    color: #405a70;
    text-transform: uppercase;
    z-index: 2;
  }

  #mainSnow {
    position: absolute; inset: 0;
    pointer-events: none;
    z-index: 1;
  }

  @media (max-width: 700px) {
    .start-title { font-size: 28px; letter-spacing: 8px; }
    .title-main { font-size: 36px; letter-spacing: 10px; }
    .main-title { font-size: 32px; letter-spacing: 8px; }
    .title-sub, .main-sub { font-size: 11px; letter-spacing: 4px; }
    #skipBtn { top: 15px; right: 15px; padding: 8px 14px; font-size: 10px; }
    .start-aquila { font-size: 40px; letter-spacing: 12px; }
  }
</style>
</head>
<body>

<!-- ============================================
     ЭКРАН СТАРТА — КЛИК ДЛЯ ЗАПУСКА
     ============================================ -->
<div id="startScreen">
  <div class="start-aquila">❄</div>
  <div class="start-title">Snow Queen</div>
  <div class="start-sub">◈ Winter Realm — 2026 ◈</div>
  <div class="start-hint">▶ Нажмите, чтобы начать</div>
  <div class="start-author">Создано Krio Wertuk</div>
</div>

<!-- ============================================
     ИНТРО
     ============================================ -->
<div id="intro">
  <div id="bgLayer"></div>
  <canvas id="snowCanvas"></canvas>

  <div id="introTitles">
    <div class="title-main">Snow Queen</div>
    <div class="title-sub">— Снежная Королева —</div>
    <div class="title-author">Создано <span>Krio Wertuk</span></div>
  </div>

  <button id="skipBtn">⏭ Пропустить</button>

  <div id="progressBar"><div id="progressFill"></div></div>
</div>

<!-- ============================================
     ОСНОВНАЯ СТРАНИЦА
     ============================================ -->
<div id="mainSite">
  <canvas id="mainSnow"></canvas>
  <div class="main-content">
    <h1 class="main-title">Snow Queen</h1>
    <div class="main-sub">◈ Winter Realm ◈</div>
    <div class="main-info">
      <div>Проект: <span class="highlight">SNOW QUEEN</span></div>
      <div>Стиль: <span class="highlight">Dark Ambient · Drum and Bass · Russian Folk</span></div>
      <div>Год: <span class="highlight">2026</span></div>
    </div>
  </div>
  <div class="main-footer">
    ◈ 2026 — Создано Krio Wertuk ◈
  </div>
</div>

<script>
/* ============================================
   ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
   ============================================ */
const startScreen = document.getElementById('startScreen');
const intro = document.getElementById('intro');
const mainSite = document.getElementById('mainSite');
const skipBtn = document.getElementById('skipBtn');
const bgLayer = document.getElementById('bgLayer');
const introTitles = document.getElementById('introTitles');
const progressBar = document.getElementById('progressBar');
const progressFill = document.getElementById('progressFill');

const INTRO_DURATION = 248000; // 4 минуты 8 секунд = 248 секунд = 248000 мс

let audio = null;
let audioCtx = null;
let analyser = null;
let source = null;
let dataArray = null;
let freqData = null;

let snowAnim = null;
let snowflakes = [];
let snowdriftHeight = 0;
let startTime = null;
let introSkipped = false;

/* Аудио-реактивные переменные */
let audioLevels = {
  bass: 0,
  mid: 0,
  treble: 0,
  overall: 0
};

/* ============================================
   ПРОВЕРКА ФЛАГА СЕССИИ
   ============================================ */
if (sessionStorage.getItem('snow-queen-intro-played') === '1') {
  startScreen.style.display = 'none';
  intro.style.display = 'none';
  mainSite.classList.add('show');
  startMainSnow();
} else {
  /* Ждём клика для старта */
  startScreen.addEventListener('click', launchIntro, { once: true });
  /* Также по любой клавише */
  document.addEventListener('keydown', function startOnce(e) {
    if (!audio) {
      launchIntro();
      document.removeEventListener('keydown', startOnce);
    }
  }, { once: true });
}

/* ============================================
   ЗАПУСК ПОСЛЕ КЛИКА
   ============================================ */
function launchIntro() {
  startScreen.classList.add('hidden');
  setTimeout(() => { startScreen.style.display = 'none'; }, 1000);

  /* Стартуем аудио и интро */
  initAudio();
  startIntroSequence();
}

/* ============================================
   АУДИО + WEB AUDIO API (для реакции снега)
   ============================================ */
function initAudio() {
  audio = new Audio('snow-queen.mp3');
  audio.loop = false; // Играем один раз — 4:08
  audio.volume = 0;
  audio.crossOrigin = 'anonymous';

  audio.play().catch(err => {
    console.warn('Ошибка воспроизведения:', err);
  });

  /* Плавное нарастание громкости */
  const targetVol = 0.75;
  const duration = 3000;
  const fadeStart = Date.now();

  const fadeIn = setInterval(() => {
    if (!audio) return;
    const elapsed = Date.now() - fadeStart;
    const progress = Math.min(elapsed / duration, 1);
    audio.volume = targetVol * progress;
    if (progress >= 1) clearInterval(fadeIn);
  }, 50);

  /* Настраиваем Web Audio API для реакции снега на музыку */
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.8;

    source = audioCtx.createMediaElementSource(audio);
    source.connect(analyser);
    analyser.connect(audioCtx.destination);

    dataArray = new Uint8Array(analyser.frequencyBinCount);
    freqData = new Uint8Array(analyser.frequencyBinCount);

    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {
    console.warn('Web Audio API недоступен:', e);
  }

  /* Обновляем прогресс-бар */
  audio.addEventListener('timeupdate', () => {
    if (audio.duration) {
      const pct = (audio.currentTime / audio.duration) * 100;
      progressFill.style.width = pct + '%';
    }
  });

  /* Завершение трека — если интро ещё идёт, завершаем */
  audio.addEventListener('ended', () => {
    if (!introSkipped) finishIntro();
  });
}

/* ============================================
   АНАЛИЗ АУДИО — 3 ПОЛОСЫ (БАС / СЕРЕДИНА / ВЕРХ)
   ============================================ */
function analyzeAudio() {
  if (!analyser || !dataArray) {
    return { bass: 0, mid: 0, treble: 0, overall: 0 };
  }

  analyser.getByteFrequencyData(dataArray);

  const len = dataArray.length;
  const bassEnd = Math.floor(len * 0.1);   // 0–10% — бас
  const midEnd = Math.floor(len * 0.5);    // 10–50% — середина
  // 50–100% — верх

  let bass = 0, mid = 0, treble = 0;

  for (let i = 0; i < bassEnd; i++) bass += dataArray[i];
  for (let i = bassEnd; i < midEnd; i++) mid += dataArray[i];
  for (let i = midEnd; i < len; i++) treble += dataArray[i];

  bass = (bass / bassEnd) / 255;
  mid = (mid / (midEnd - bassEnd)) / 255;
  treble = (treble / (len - midEnd)) / 255;

  return {
    bass: Math.min(bass * 1.8, 1),      // усиливаем бас
    mid: Math.min(mid * 1.4, 1),
    treble: Math.min(treble * 1.6, 1),
    overall: Math.min((bass + mid + treble) / 3 * 1.5, 1)
  };
}

/* ============================================
   СНЕГ
   ============================================ */
const canvas = document.getElementById('snowCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const SNOW_COUNT = 450;
const WIND_BASE = 0.5;
const GRAVITY_BASE = 0.4;

const DRIFT = {
  x: 0, y: 0,
  width: 0, height: 0, maxHeight: 0,
};

function initDrift() {
  DRIFT.width = window.innerWidth * 0.35;
  DRIFT.maxHeight = window.innerHeight * 0.28;
  DRIFT.y = window.innerHeight;
  DRIFT.height = 0;
}
initDrift();
window.addEventListener('resize', () => {
  initDrift();
  if (snowAnim) { snowflakes = []; createSnowflakes(); }
});

function createSnowflakes() {
  for (let i = 0; i < SNOW_COUNT; i++) {
    snowflakes.push({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight - window.innerHeight,
      size: 0.8 + Math.random() * 3.5,
      speed: 0.5 + Math.random() * 1.8,
      windOffset: (Math.random() - 0.5) * 0.8,
      opacity: 0.3 + Math.random() * 0.7,
      wobble: Math.random() * Math.PI * 2,
      wobbleSpeed: 0.01 + Math.random() * 0.03,
      /* Скорость реакции на музыку — разная для каждой снежинки */
      audioSensitivity: 0.5 + Math.random() * 1.5,
    });
  }
}

function drawSnowflake(s) {
  ctx.globalAlpha = s.opacity;
  ctx.fillStyle = '#e8f4ff';
  ctx.shadowColor = 'rgba(180, 220, 255, 0.8)';
  ctx.shadowBlur = s.size * 3;
  ctx.beginPath();
  ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
}

function drawDrift() {
  if (DRIFT.height < 1) return;
  const baseY = window.innerHeight;
  const topY = baseY - DRIFT.height;

  ctx.beginPath();
  ctx.moveTo(0, baseY);
  ctx.lineTo(0, topY + DRIFT.height * 0.3);
  const steps = 20;
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const x = t * DRIFT.width;
    const h = DRIFT.height * Math.pow(1 - t, 1.6);
    ctx.lineTo(x, baseY - h);
  }
  ctx.lineTo(DRIFT.width, baseY);
  ctx.closePath();

  const grad = ctx.createLinearGradient(0, topY, 0, baseY);
  grad.addColorStop(0, 'rgba(240, 248, 255, 0.95)');
  grad.addColorStop(0.5, 'rgba(220, 235, 250, 0.9)');
  grad.addColorStop(1, 'rgba(180, 210, 240, 0.85)');

  ctx.fillStyle = grad;
  ctx.shadowColor = 'rgba(180, 220, 255, 0.5)';
  ctx.shadowBlur = 20;
  ctx.fill();
  ctx.shadowBlur = 0;
}

/* ============================================
   ЦИКЛ АНИМАЦИИ СНЕГА — С РЕАКЦИЕЙ НА МУЗЫКУ
   ============================================ */
function animateSnow() {
  snowAnim = requestAnimationFrame(animateSnow);

  const w = canvas.width;
  const h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  /* Анализируем музыку */
  const audio = analyzeAudio();

  /* Время + базовые колебания */
  const t = (Date.now() - startTime) / 1000;
  const baseWind = 0.5 + Math.sin(t * 0.3) * 1.0 + Math.sin(t * 0.7) * 0.4;

  /* ВЕТЕР РЕАГИРУЕТ НА МУЗЫКУ:
     - треble (высокие) дают порывы — резкие движения в стороны
     - mid добавляет общий сдвиг
     - bass даёт "толчок" */
  const musicWind = (audio.treble * 3.5) + (audio.mid * 1.2) + (audio.bass * 0.8);
  const wind = baseWind + musicWind;

  /* Гравитация реагирует на бас — на ударах снег "тяжелеет" */
  const gravity = GRAVITY_BASE + audio.bass * 1.2;

  /* Общая скорость падения растёт с громкостью */
  const speedBoost = 1 + audio.overall * 0.8;

  const introActive = !introSkipped && intro.style.display !== 'none';

  for (let i = snowflakes.length - 1; i >= 0; i--) {
    const s = snowflakes[i];
    if (!s) continue;

    /* Движение — комбинирует гравитацию, ветер, музыку и wobble */
    s.y += s.speed * speedBoost * gravity + Math.sin(t * 0.4) * 0.2;
    s.wobble += s.wobbleSpeed;
    s.x += (wind * s.speed * s.audioSensitivity) + Math.sin(s.wobble) * 0.5 + s.windOffset;

    if (s.x > w + 10) s.x = -10;
    if (s.x < -10) s.x = w + 10;

    /* Попадание в сугроб */
    if (introActive && s.y > h - DRIFT.height * 0.3 && s.x < DRIFT.width * 0.9) {
      const inDriftZone = s.x < DRIFT.width * (1 - (s.y - (h - DRIFT.height)) / DRIFT.height * 0.5);
      if (inDriftZone && DRIFT.height < DRIFT.maxHeight) {
        DRIFT.height += s.size * 0.15;
        if (DRIFT.height > DRIFT.maxHeight) DRIFT.height = DRIFT.maxHeight;
        snowflakes.splice(i, 1);
        continue;
      }
    }

    if (s.y > h + 10) {
      s.y = -10;
      s.x = Math.random() * w;
      continue;
    }

    drawSnowflake(s);
  }

  /* Восстанавливаем снежинки, пока идёт интро */
  if (introActive && snowflakes.length < SNOW_COUNT) {
    const toAdd = Math.min(5, SNOW_COUNT - snowflakes.length);
    for (let i = 0; i < toAdd; i++) {
      snowflakes.push({
        x: Math.random() * w,
        y: -10 - Math.random() * 50,
        size: 0.8 + Math.random() * 3.5,
        speed: 0.5 + Math.random() * 1.8,
        windOffset: (Math.random() - 0.5) * 0.8,
        opacity: 0.3 + Math.random() * 0.7,
        wobble: Math.random() * Math.PI * 2,
        wobbleSpeed: 0.01 + Math.random() * 0.03,
        audioSensitivity: 0.5 + Math.random() * 1.5,
      });
    }
  }

  drawDrift();
}

function startSnow() {
  if (snowAnim) return;
  snowflakes = [];
  createSnowflakes();
  animateSnow();
}

/* ============================================
   ПОСЛЕДОВАТЕЛЬНОСТЬ ИНТРО (4:08)
   ============================================ */
function startIntroSequence() {
  startTime = Date.now();

  /* Фаза 1: чёрный экран 2 сек */
  setTimeout(() => {
    bgLayer.classList.add('show');
    progressBar.classList.add('show');

    /* Фаза 2: старт снега */
    setTimeout(() => {
      startSnow();
      skipBtn.classList.add('show');
    }, 500);

    /* Фаза 3: титры (в конце — за 20 сек до конца трека) */
    const titlesTime = INTRO_DURATION - 20000;
    setTimeout(() => {
      introTitles.classList.add('show');
    }, titlesTime);

    /* Фаза 4: полное завершение */
    setTimeout(() => {
      if (!introSkipped) finishIntro();
    }, INTRO_DURATION);

  }, 2000);
}

/* ============================================
   SKIP
   ============================================ */
skipBtn.addEventListener('click', () => {
  introSkipped = true;
  finishIntro();
});

/* ============================================
   ЗАВЕРШЕНИЕ
   ============================================ */
function finishIntro() {
  introSkipped = true;

  /* Затухание звука */
  if (audio) {
    const fadeOutStart = audio.volume;
    const fadeOutDuration = 1500;
    const fadeOutStartTime = Date.now();

    const fadeOut = setInterval(() => {
      const elapsed = Date.now() - fadeOutStartTime;
      const progress = Math.min(elapsed / fadeOutDuration, 1);
      audio.volume = fadeOutStart * (1 - progress);
      if (progress >= 1) {
        clearInterval(fadeOut);
        audio.pause();
      }
    }, 50);
  }

  intro.classList.add('hidden');
  mainSite.classList.add('show');

  sessionStorage.setItem('snow-queen-intro-played', '1');

  setTimeout(() => {
    intro.style.display = 'none';
    if (snowAnim) cancelAnimationFrame(snowAnim);
    snowAnim = null;
    startMainSnow();
  }, 1500);
}

/* ============================================
   ФОНОВЫЙ СНЕГ НА ОСНОВНОЙ СТРАНИЦЕ
   ============================================ */
const mainSnowCanvas = document.getElementById('mainSnow');
const mainCtx = mainSnowCanvas.getContext('2d');
let mainSnowflakes = [];
let mainSnowAnim = null;

function startMainSnow() {
  const resize = () => {
    mainSnowCanvas.width = window.innerWidth;
    mainSnowCanvas.height = window.innerHeight;
  };
  resize();
  window.addEventListener('resize', resize);

  mainSnowflakes = [];
  for (let i = 0; i < 150; i++) {
    mainSnowflakes.push({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      size: 0.5 + Math.random() * 2,
      speed: 0.3 + Math.random() * 1,
      opacity: 0.2 + Math.random() * 0.5,
      wobble: Math.random() * Math.PI * 2,
      wobbleSpeed: 0.01 + Math.random() * 0.02,
    });
  }

  let mainStart = Date.now();

  function animateMain() {
    mainSnowAnim = requestAnimationFrame(animateMain);
    const w = mainSnowCanvas.width;
    const h = mainSnowCanvas.height;
    mainCtx.clearRect(0, 0, w, h);

    const t = (Date.now() - mainStart) / 1000;
    const wind = 0.4 + Math.sin(t * 0.2) * 0.6;

    for (const s of mainSnowflakes) {
      s.y += s.speed;
      s.wobble += s.wobbleSpeed;
      s.x += wind * s.speed + Math.sin(s.wobble) * 0.3;

      if (s.y > h + 5) { s.y = -5; s.x = Math.random() * w; }
      if (s.x > w + 5) s.x = -5;
      if (s.x < -5) s.x = w + 5;

      mainCtx.globalAlpha = s.opacity;
      mainCtx.fillStyle = '#e8f4ff';
      mainCtx.shadowColor = 'rgba(180, 220, 255, 0.6)';
      mainCtx.shadowBlur = s.size * 2;
      mainCtx.beginPath();
      mainCtx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      mainCtx.fill();
    }
    mainCtx.globalAlpha = 1;
    mainCtx.shadowBlur = 0;
  }
  animateMain();
}
</script>
